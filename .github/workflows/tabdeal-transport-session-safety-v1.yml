name: Tabdeal Transport Session Safety Tests v1

on:
  push:
    branches:
      - fix/transport-stale-session-callbacks-2026-10-19
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  transport-session-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_CHECKOUT_SHA=$actual"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused transport fault-injection tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_tabdeal_transport_v1.py
