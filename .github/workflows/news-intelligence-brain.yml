name: News Intelligence Brain
on:
  pull_request:
    paths:
      - 'core/market_intelligence/news_brain.py'
      - 'config/news_sources_v1.json'
      - 'tests/test_news_brain_v1.py'
      - 'tests/test_news_decision_gate_v1.py'
      - 'forward/news_decision_gate_v1.py'
      - '.github/workflows/news-intelligence-brain.yml'
  push:
    branches: [main]
    paths:
      - 'core/market_intelligence/news_brain.py'
      - 'config/news_sources_v1.json'
      - 'tests/test_news_brain_v1.py'
      - 'tests/test_news_decision_gate_v1.py'
      - 'forward/news_decision_gate_v1.py'
      - '.github/workflows/news-intelligence-brain.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_news_*v1.py' -v
