name: Feature Engine VWAP Tests

on:
  push:
    branches: ["main", "feature-engine-vwap-integration-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  feature-engine-vwap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run VWAP integration tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/data_engine/test_intelligence_core.py
