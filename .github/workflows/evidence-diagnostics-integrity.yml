name: Evidence Diagnostics Integrity Audit

on:
  push:
    branches:
      - "audit/evidence-diagnostics-integrity"
  pull_request:
    paths:
      - "core/evaluation/evidence.py"
      - "core/evaluation/diagnostics.py"
      - "tests/evaluation/test_diagnostics_integrity.py"
      - ".github/workflows/evidence-diagnostics-integrity.yml"

jobs:
  diagnostics-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run diagnostics integrity tests
        run: PYTHONPATH=. pytest -q tests/evaluation/test_diagnostics_integrity.py
