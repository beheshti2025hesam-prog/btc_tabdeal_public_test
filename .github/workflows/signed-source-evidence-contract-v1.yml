name: Signed Source Evidence Contract v1
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/source-signature-identity-contract-20261013, security/pinned-registry-identity-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || {
            echo "SOURCE_SHA_MISMATCH expected=$EXPECTED_SOURCE_SHA actual=$actual"
            exit 1
          }
          echo "CHECKED_OUT_SOURCE_SHA=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned verifier dependency
        run: python -m pip install 'cryptography==45.0.7'
      - name: Run combined hostile source-signature tests
        run: python -m unittest -v tests.test_signed_source_evidence_v1 tests.test_signed_sequence_contract_gate_v1 tests.test_controlled_forward_observation_runner_v1 tests.test_unknown_sequence_cannot_authorize_ordering_v1
