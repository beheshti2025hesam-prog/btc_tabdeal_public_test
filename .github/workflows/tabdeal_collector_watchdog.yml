name: Hes Trade Agent — Tabdeal Collector Watchdog

on:
  schedule:
    - cron: "02,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tabdeal-btc-usdt-collector-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check main collector chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/actions/workflows/run.yml/runs?branch=$DEFAULT_BRANCH&per_page=50"
          runs="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$api")"
          active_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if [ "$active_count" -gt 0 ]; then
            echo "Main collector chain active/queued; no recovery dispatch."
            exit 0
          fi
          latest="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.status == "completed") | {id, updated_at, conclusion, run_number, head_branch}] | sort_by(.updated_at) | last // empty')"
          if [ -z "$latest" ]; then
            echo "No completed main-branch collector run is visible; fail closed."
            exit 0
          fi
          conclusion="$(printf '%s' "$latest" | jq -r '.conclusion')"
          completed_at="$(printf '%s' "$latest" | jq -r '.updated_at')"
          run_number="$(printf '%s' "$latest" | jq -r '.run_number')"
          now_epoch="$(date -u +%s)"
          completed_epoch="$(date -u -d "$completed_at" +%s)"
          age_seconds="$((now_epoch - completed_epoch))"
          echo "Latest completed main collector: #$run_number conclusion=$conclusion age=${age_seconds}s"
          if [ "$conclusion" != "success" ]; then
            echo "Latest main collector did not complete successfully; fail closed."
            echo "No automatic recovery is issued because the latest completion may indicate a data-integrity or persistence fault."
            exit 0
          fi
          if [ "$age_seconds" -lt 1200 ]; then
            echo "Latest successful main completion is younger than 20 minutes; no recovery needed."
            exit 0
          fi
          latest_run_id="$(printf '%s' "$latest" | jq -r '.id')"
          # Use the exact same predecessor-scoped claim key as the normal N→N+1 handoff.
          # This closes the watchdog-vs-successor-dispatch race: only one actor may
          # acquire the successor claim for a given predecessor run.
          claim_ref="refs/heads/collector-handoff-claims/successor-${latest_run_id}"
          claim_api="https://api.github.com/repos/$REPO/git/refs"
          claim_payload="$(jq -n --arg ref "$claim_ref" --arg sha "${{ github.sha }}" '{ref:$ref,sha:$sha}')"
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out "%{http_code}" --request POST --url "$claim_api" --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10" --data "$claim_payload")"
          case "$status" in
            201)
              echo "Successor/recovery claim acquired without mutating main: $claim_ref"
              claim_state_path=".github/collector-handoff-claims/state.json"
              claim_state="$(jq -n --arg predecessor_run_id "$latest_run_id" --arg claim_ref "$claim_ref" '{schema_version:1,state:"claimed",predecessor_run_id:($predecessor_run_id|tonumber),claim_ref:$claim_ref}')"
              encoded_state="$(printf '%s' "$claim_state" | base64 -w0)"
              state_payload="$(jq -n --arg message "Record watchdog handoff claim" --arg content "$encoded_state" --arg branch "collector-handoff-claims/successor-$latest_run_id" '{message:$message,content:$content,branch:$branch}')"
              state_response="$(mktemp)"
              state_status="$(curl --silent --show-error --output "$state_response" --write-out "%{http_code}" --request PUT --url "https://api.github.com/repos/$REPO/contents/$claim_state_path" --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10" --data "$state_payload")"
              if [ "$state_status" != "201" ]; then
                echo "Could not persist watchdog claim state; fail closed."
                cat "$state_response"
                exit 1
              fi
              ;;
            422)
              echo "Successor claim already exists; reconcile only from durable claim state."
              claim_state_path=".github/collector-handoff-claims/state.json"
              state_response="$(mktemp)"
              state_status="$(curl --silent --show-error --output "$state_response" --write-out "%{http_code}" --request GET --url "https://api.github.com/repos/$REPO/contents/$claim_state_path?ref=collector-handoff-claims/successor-$latest_run_id" --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10")"
              if [ "$state_status" != "200" ]; then
                echo "Claim exists but durable state is unavailable; fail closed."
                cat "$state_response"
                exit 1
              fi
              state="$(jq -r '.content' "$state_response" | tr -d '\n' | base64 -d)"
              state_name="$(printf '%s' "$state" | jq -r '.state // empty')"
              successor_run_id="$(printf '%s' "$state" | jq -r '.successor_run_id // empty')"
              case "$state_name" in
                dispatch_accepted)
                  if ! [[ "$successor_run_id" =~ ^[0-9]+$ ]]; then
                    echo "Accepted state lacks a concrete successor_run_id; fail closed."
                    exit 1
                  fi
                  run_response="$(mktemp)"
                  run_status="$(curl --silent --show-error --output "$run_response" --write-out "%{http_code}" --request GET --url "https://api.github.com/repos/$REPO/actions/runs/$successor_run_id" --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10")"
                  if [ "$run_status" = "200" ]; then
                    echo "Successor run $successor_run_id is materialized; suppress duplicate recovery."
                    exit 0
                  fi
                  echo "Accepted successor run $successor_run_id is not currently visible; await visibility, no duplicate dispatch."
                  cat "$run_response"
                  exit 0
                  ;;
                claimed)
                  echo "Claim exists but dispatch acceptance is not durably recorded; fail closed."
                  exit 0
                  ;;
                *)
                  echo "Unknown handoff state '$state_name'; fail closed."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unexpected recovery claim API status=$status; fail closed."
              cat "$response"
              exit 1
              ;;
          esac
          echo "No active/pending main collector, stale successful predecessor, and recovery claim acquired."
          echo "Dispatching one recovery collector run on the default branch."
          dispatch_response="$(mktemp)"
          dispatch_status="$(curl --silent --show-error --output "$dispatch_response" --write-out "%{http_code}" \
            --request POST \
            --url "https://api.github.com/repos/$REPO/actions/workflows/run.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data '{"ref":"${{ github.event.repository.default_branch }}","inputs":{"run_mode":"production","smoke_depth":"0","predecessor_run_id":"'"$latest_run_id"'"}}')"
          successor_run_id="$(jq -r '.workflow_run_id // empty' "$dispatch_response")"
          if [ "$dispatch_status" != "200" ] || ! [[ "$successor_run_id" =~ ^[0-9]+$ ]]; then
            echo "Recovery dispatch did not return a concrete workflow_run_id; fail closed."
            echo "HTTP status=$dispatch_status"
            cat "$dispatch_response"
            exit 1
          fi
          echo "Recovery successor run materialized: id=$successor_run_id predecessor=$latest_run_id."
          claim_state_path=".github/collector-handoff-claims/state.json"
          state_response="$(mktemp)"
          state_status="$(curl --silent --show-error --output "$state_response" --write-out "%{http_code}" --request GET --url "https://api.github.com/repos/$REPO/contents/$claim_state_path?ref=collector-handoff-claims/successor-$latest_run_id" --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10")"
          if [ "$state_status" != "200" ]; then
            echo "Cannot read watchdog claim state after dispatch; fail closed."
            cat "$state_response"
            exit 1
          fi
          file_sha="$(jq -r '.sha' "$state_response")"
          current_state="$(jq -r '.content' "$state_response" | tr -d '\n' | base64 -d)"
          updated_state="$(printf '%s' "$current_state" | jq --arg state "dispatch_accepted" --arg dispatch_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg successor_run_id "$successor_run_id" '.state=$state | .dispatch_at=$dispatch_at | .successor_run_id=($successor_run_id|tonumber)')"
          encoded_state="$(printf '%s' "$updated_state" | base64 -w0)"
          update_payload="$(jq -n --arg message "Record accepted watchdog successor" --arg content "$encoded_state" --arg sha "$file_sha" --arg branch "collector-handoff-claims/successor-$latest_run_id" '{message:$message,content:$content,sha:$sha,branch:$branch}')"
          update_response="$(mktemp)"
          update_status="$(curl --silent --show-error --output "$update_response" --write-out "%{http_code}" --request PUT --url "https://api.github.com/repos/$REPO/contents/$claim_state_path" --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10" --data "$update_payload")"
          if [ "$update_status" != "200" ]; then
            echo "Could not persist accepted watchdog successor state; fail closed."
            cat "$update_response"
            exit 1
          fi
