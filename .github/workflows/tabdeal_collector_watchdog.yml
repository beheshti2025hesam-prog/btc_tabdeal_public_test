name: Hes Trade Agent — Tabdeal Collector Watchdog

on:
  schedule:
    - cron: "02,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: tabdeal-btc-usdt-collector-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check main collector chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/actions/workflows/run.yml/runs?branch=$DEFAULT_BRANCH&per_page=50"
          get_runs() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$api"
          }

          runs="$(get_runs)"
          active_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.run_name == "HES Trade Agent — Tabdeal Collector — production") | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if [ "$active_count" -gt 0 ]; then
            echo "Main collector chain active/queued; no recovery dispatch."
            exit 0
          fi
          latest="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.run_name == "HES Trade Agent — Tabdeal Collector — production") | select(.status == "completed") | {updated_at, conclusion, run_number, head_branch}] | sort_by(.updated_at) | last // empty')"
          if [ -z "$latest" ]; then
            echo "No completed main-branch collector run is visible; fail closed."
            exit 0
          fi
          conclusion="$(printf '%s' "$latest" | jq -r '.conclusion')"
          completed_at="$(printf '%s' "$latest" | jq -r '.updated_at')"
          run_number="$(printf '%s' "$latest" | jq -r '.run_number')"
          now_epoch="$(date -u +%s)"
          completed_epoch="$(date -u -d "$completed_at" +%s)"
          age_seconds="$((now_epoch - completed_epoch))"
          echo "Latest completed main collector: #$run_number conclusion=$conclusion age=${age_seconds}s"
          if [ "$conclusion" != "success" ]; then
            echo "Latest main collector did not complete successfully; fail closed."
            echo "No automatic rerun is issued because a failed collector may indicate a data-integrity or persistence fault."
            exit 0
          fi
          if [ "$age_seconds" -lt 1200 ]; then
            echo "Latest successful main completion is younger than 20 minutes; no recovery needed."
            exit 0
          fi
          # Authoritative second check immediately before dispatch. If a
          # production collector appeared or a fresh production success completed
          # during this watchdog evaluation, do not add another queued run.
          echo "Re-checking production collector state immediately before recovery dispatch."
          runs="$(get_runs)"
          active_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.run_name == "HES Trade Agent — Tabdeal Collector — production") | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if [ "$active_count" -gt 0 ]; then
            echo "Production collector became active/queued during watchdog evaluation; no recovery dispatch."
            exit 0
          fi

          latest_success="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.run_name == "HES Trade Agent — Tabdeal Collector — production") | select(.status == "completed" and .conclusion == "success") | .updated_at] | sort | last // empty')"
          if [ -n "$latest_success" ]; then
            latest_success_epoch="$(date -u -d "$latest_success" +%s)"
            now_epoch="$(date -u +%s)"
            latest_age="$((now_epoch - latest_success_epoch))"
            if [ "$latest_age" -lt 1200 ]; then
              echo "A fresh production success appeared during watchdog evaluation; no recovery dispatch."
              exit 0
            fi
          fi

          echo "No active/pending production collector and last successful production completion is stale."
          echo "Dispatching one recovery collector run on the default branch."
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/$REPO/actions/workflows/run.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{\"ref\":\"$DEFAULT_BRANCH\",\"inputs\":{\"run_mode\":\"production\",\"smoke_depth\":\"0\"}}"
