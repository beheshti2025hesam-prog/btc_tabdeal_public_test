name: Hes Trade Agent — Tabdeal Collector Watchdog

on:
  schedule:
    - cron: "02,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: tabdeal-btc-usdt-collector-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check collector chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/actions/workflows/run.yml/runs?per_page=50"
          runs="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$api")"
          active_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if [ "$active_count" -gt 0 ]; then
            echo "Collector chain active/queued; no recovery dispatch."
            exit 0
          fi
          latest="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.status == "completed") | {updated_at, conclusion, run_number}] | sort_by(.updated_at) | last // empty')"
          if [ -z "$latest" ]; then
            echo "No completed collector run is visible; fail closed."
            exit 0
          fi
          conclusion="$(printf '%s' "$latest" | jq -r '.conclusion')"
          completed_at="$(printf '%s' "$latest" | jq -r '.updated_at')"
          run_number="$(printf '%s' "$latest" | jq -r '.run_number')"
          now_epoch="$(date -u +%s)"
          completed_epoch="$(date -u -d "$completed_at" +%s)"
          age_seconds="$((now_epoch - completed_epoch))"
          echo "Latest completed collector: #$run_number conclusion=$conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "Latest collector did not complete successfully; fail closed."
            echo "No automatic rerun is issued because a failed collector may indicate a data-integrity or persistence fault."
            exit 0
          fi
          if [ "$age_seconds" -lt 1200 ]; then
            echo "Latest successful completion is younger than 20 minutes; normal hand-off window."
            exit 0
          fi
          echo "No active/pending collector and last successful completion is stale."
          echo "Dispatching one recovery collector run."
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/$REPO/actions/workflows/run.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data '{"ref":"main"}'