name: HES Trade Agent — Embargo-adjusted Fold/Regime Independence

on:
  push:
    branches:
      - embargo-adjusted-fold-regime-independence-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  embargo-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      HES_FROZEN_CSV: /tmp/hes_frozen_trades.csv
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Materialize frozen OOS snapshot
        run: |
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/beheshti2025hesam-prog/btc_tabdeal_public_test/git/blobs/1a44d52a0588deb765bbbea04bfb5783dcb1050b > /tmp/hes_blob.json
          python -c 'import base64,json; d=json.load(open("/tmp/hes_blob.json")); assert d["sha"]=="1a44d52a0588deb765bbbea04bfb5783dcb1050b"; open("/tmp/hes_frozen_trades.csv","wb").write(base64.b64decode(d["content"]))'
          test -s /tmp/hes_frozen_trades.csv
      - name: Regression tests
        run: python -m pytest -q tests/backtest/test_embargo_adjusted_fold_regime_independence.py
      - name: Run embargo-adjusted audit
        run: python scripts/embargo_adjusted_fold_regime_independence.py
      - name: Upload embargo-adjusted evidence
        uses: actions/upload-artifact@v4
        with:
          name: embargo-adjusted-fold-regime-independence
          path: embargo_adjusted_fold_regime_independence.json
          if-no-files-found: error

# Deterministic evidence-only audit; no execution or promotion behavior.
