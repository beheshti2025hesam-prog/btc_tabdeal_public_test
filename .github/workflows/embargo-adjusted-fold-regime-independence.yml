name: HES Trade Agent — Embargo-adjusted Fold/Regime Independence

on:
  push:
    branches:
      - embargo-adjusted-fold-regime-independence-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  embargo-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Regression tests
        run: python -m pytest -q tests/backtest/test_embargo_adjusted_fold_regime_independence.py
      - name: Run embargo-adjusted audit
        run: python scripts/embargo_adjusted_fold_regime_independence.py
      - name: Upload embargo-adjusted evidence
        uses: actions/upload-artifact@v4
        with:
          name: embargo-adjusted-fold-regime-independence
          path: embargo_adjusted_fold_regime_independence.json
          if-no-files-found: error
