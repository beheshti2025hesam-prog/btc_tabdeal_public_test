name: Gate.io Dashboard Full Repository Regression

on:
  pull_request:
  push:
    branches:
      - integration/gateio-persisted-feed-signal-agent-20261026

permissions:
  contents: read

jobs:
  full-suite:
    name: Exact-head full repository pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository dependencies and pytest
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run complete repository suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
