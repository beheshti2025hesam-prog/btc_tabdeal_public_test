name: Real Data Backtest Tests

on:
  push:
    branches: ["main", "real-data-backtest-integration-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  real-data-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/backtest/test_real_data.py tests/backtest/test_validation.py tests/backtest/test_engine.py
        env:
          PYTHONPATH: .

  canonical-evidence-reconciliation:
    if: github.head_ref == 'protocol-reconciliation-independent-snapshot-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCKED_RAW_BLOB_SHA: 58d21825e052dbaa42e7eb0695455c19997bff43
      LOCKED_RAW_SOURCE_COMMIT: b9ebecf061dfe9a084797d77b48a2c7846d269e3
      PROTOCOL_CONTRACT_SOURCE_COMMIT: e5f85f06b19b8427f761b95ab56ad15ccd7053c0
      PROTOCOL_CONTRACT_BLOB_SHA: a84dafbc09c72ac37ebbbb0706b43d23f7681e12
      HES_FROZEN_CSV: /tmp/hes_independent_trades.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Materialize locked Raw snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/beheshti2025hesam-prog/btc_tabdeal_public_test/git/blobs/${LOCKED_RAW_BLOB_SHA}" > /tmp/raw_blob.json
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          d=json.load(open("/tmp/raw_blob.json"))
          assert d["sha"]==os.environ["LOCKED_RAW_BLOB_SHA"]
          raw=base64.b64decode(d["content"])
          Path(os.environ["HES_FROZEN_CSV"]).write_bytes(raw)
          print("RAW_LOCK_OK",len(raw))
          PY
      - name: Materialize locked protocol contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/beheshti2025hesam-prog/btc_tabdeal_public_test/git/blobs/${PROTOCOL_CONTRACT_BLOB_SHA}" > /tmp/protocol.json
          python - <<'PY'
          import base64,json,os
          d=json.load(open("/tmp/protocol.json"))
          assert d["sha"]==os.environ["PROTOCOL_CONTRACT_BLOB_SHA"]
          open("/tmp/protocol_reconciliation_v1_contract.json","wb").write(base64.b64decode(d["content"]))
          print("PROTOCOL_LOCK_OK")
          PY
      - name: Run canonical full-population reconciliation
        env:
          PROTOCOL_CONTRACT_PATH: /tmp/protocol_reconciliation_v1_contract.json
        run: python scripts/protocol_reconciliation_independent_snapshot_v1.py
      - name: Verify canonical reconciliation
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open("protocol_reconciliation_full_population_audit.json"))
          assert d["protocol"]["train"]==800 and d["protocol"]["test"]==400 and d["protocol"]["step"]==400 and d["protocol"]["folds"]==8
          assert d["protocol"]["gross_threshold"]==0.0014
          assert d["protocol"]["snapshot_data_blob_sha"]==os.environ["LOCKED_RAW_BLOB_SHA"]
          assert d["protocol"]["snapshot_source_commit"]==os.environ["LOCKED_RAW_SOURCE_COMMIT"]
          assert d["counts"]["winners_gt_14bps"] + d["counts"]["controls_le_14bps"] == d["population"]["evaluated_oos"]
          assert d["population"]["evaluated_oos"] > 0
          print(json.dumps({"evaluated_oos":d["population"]["evaluated_oos"],"winners_gt_14bps":d["counts"]["winners_gt_14bps"],"controls_le_14bps":d["counts"]["controls_le_14bps"],"folds":d["protocol"]["folds"]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-full-population-reconciliation
          path: |
            protocol_reconciliation_full_population_audit.json
            protocol_reconciliation_winners.csv
          if-no-files-found: error
