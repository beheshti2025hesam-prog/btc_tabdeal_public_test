name: Real Data Backtest Tests

on:
  push:
    branches: ["main", "real-data-backtest-integration-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  real-data-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/backtest/test_real_data.py tests/backtest/test_validation.py tests/backtest/test_engine.py
        env:
          PYTHONPATH: .
