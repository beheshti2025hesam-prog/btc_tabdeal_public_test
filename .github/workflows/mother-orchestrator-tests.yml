name: Mother Orchestrator Tests
on:
  push:
    branches: ["main", "feat/multi-agent-orchestrator-v1"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_mother_orchestrator_v1.py
        env:
          PYTHONPATH: .
