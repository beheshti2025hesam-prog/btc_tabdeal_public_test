name: HES Trade Agent — Producer Failure Semantics Audit Gate

on:
  push:
    branches:
      - provenance-exception-audit-1049-v1
    paths:
      - evidence/producer_failure_semantics_audit_v1.json
      - tests/evidence/test_producer_failure_semantics_audit.py
      - .github/workflows/producer-failure-semantics-audit-gate.yml
  pull_request:
    branches:
      - main
    paths:
      - evidence/producer_failure_semantics_audit_v1.json
      - tests/evidence/test_producer_failure_semantics_audit.py
      - .github/workflows/producer-failure-semantics-audit-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-failure-semantics-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/evidence/test_producer_failure_semantics_audit.py
