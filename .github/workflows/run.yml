name: Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

  schedule:
    # Run every 4h 48m.
    # Collector runs for approximately 5h 20m,
    # so the next run is intentionally created
    # about 32 minutes before the previous run finishes.
    #
    # This allows GitHub Actions concurrency to keep
    # the next run queued/pending instead of cancelling it.
    #
    # Schedule times are UTC.
    - cron: "00 00 * * *"
    - cron: "48 04 * * *"
    - cron: "36 09 * * *"
    - cron: "24 14 * * *"
    - cron: "12 19 * * *"

permissions:
  contents: write

# CORE PROJECT REQUIREMENT:
# Keep the next run queued instead of cancelling it.
# This supports near-continuous 24/7 data collection.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false

jobs:
  collector:

    timeout-minutes: 350

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: data/trades.csv
          if-no-files-found: warn
