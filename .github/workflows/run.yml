name: Hes Trade Agent — Tabdeal BTC Futures Collector

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Collector mode"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - smoke
      smoke_depth:
        description: "Internal smoke-chain depth"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: write

# Completion-based collector chain.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false
  queue: max

jobs:
  collector:
    timeout-minutes: 350
    runs-on: ubuntu-latest
    env:
      COLLECTOR_RUN_SECONDS: "19200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Collect BTC_USDT Futures Trades
        id: collect
        if: ${{ inputs.run_mode == 'production' }}
        run: |
          python -u tabdeal_futures_ws_test.py

      - name: Smoke-chain step
        id: smoke
        if: ${{ inputs.run_mode == 'smoke' }}
        run: |
          set -euo pipefail
          depth="${{ inputs.smoke_depth }}"
          if ! [[ "$depth" =~ ^[0-9]+$ ]]; then
            echo "Invalid smoke_depth: $depth"
            exit 1
          fi
          echo "Smoke chain depth=$depth"
          if [ "$depth" -ge 2 ]; then
            echo "Smoke-chain terminal reached."
          fi
      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: |
            data/trades.csv
            data/archive
          if-no-files-found: warn
      - name: Dispatch next collector
        if: ${{ steps.collect.outcome == 'success' || (inputs.run_mode == 'smoke' && steps.smoke.outcome == 'success' && fromJSON(inputs.smoke_depth || '0') < 2) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          next_depth="0"
          if [ "${{ inputs.run_mode }}" = "smoke" ]; then
            next_depth=$((${{ fromJSON(inputs.smoke_depth || '0') }} + 1))
          fi
          echo "Dispatching successor: mode=${{ inputs.run_mode }} depth=$next_depth ref=main"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{\"ref\":\"main\",\"inputs\":{\"run_mode\":\"${{ inputs.run_mode }}\",\"smoke_depth\":\"$next_depth\"}}"
