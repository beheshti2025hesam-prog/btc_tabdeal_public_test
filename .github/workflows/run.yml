name: Hes Trade Agent — Tabdeal BTC Futures Collector

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Collector mode"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - smoke
      smoke_depth:
        description: "Internal smoke-chain depth"
        required: false
        default: "0"
        type: string


permissions:
  actions: write
  contents: write

# Collector safety boundary:
# - Exactly one collector run may execute at a time.
# - A running collector must NEVER be canceled by a newer run.
# - Multiple pending runs must NOT replace/cancel each other.
#   queue: max preserves queued scheduled collectors.
#
# Manual dispatch intentionally uses the same lock so it cannot run beside
# a scheduled/pending collector and corrupt the shared CSV/archive state.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false
  queue: max

jobs:
  collector:
    timeout-minutes: 350

    runs-on: ubuntu-latest

    env:
      # Restore original 5h20m collection window.
      # 4h cadence => approximately 80m overlap/queue protection.
      COLLECTOR_RUN_SECONDS: "19200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        id: collect
        if: ${{ inputs.run_mode == 'production' }}
        run: |
          # Safety fuse: the collector has an internal timer, but a stuck
          # websocket must never hold the concurrency lock indefinitely.
          # Keep the proven 5h20m runtime; only enforce a hard upper bound.
          timeout --signal=TERM --kill-after=60s "${COLLECTOR_RUN_SECONDS}s" \
            python -u tabdeal_futures_ws_test.py

      - name: Smoke-chain step
        id: smoke
        if: ${{ inputs.run_mode == 'smoke' }}
        run: |
          set -euo pipefail
          depth="${{ inputs.smoke_depth }}"
          [[ "$depth" =~ ^[0-9]+$ ]] || exit 1
          [ "$depth" -le 2 ] || exit 1
          echo "Smoke chain depth=$depth"

      - name: Dispatch next collector
        if: ${{ steps.collect.outcome == 'success' || (inputs.run_mode == 'smoke' && steps.smoke.outcome == 'success' && fromJSON(inputs.smoke_depth || '0') < 2) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          next_depth="0"
          if [ "${{ inputs.run_mode }}" = "smoke" ]; then
            next_depth=$((${{ fromJSON(inputs.smoke_depth || '0') }} + 1))
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"run_mode\":\"${{ inputs.run_mode }}\",\"smoke_depth\":\"$next_depth\"}}"

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: |
            data/trades.csv
            data/archive
          if-no-files-found: warn
