name: Hes Trade Agent — Tabdeal BTC Futures Collector

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Collector mode"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - smoke
      smoke_depth:
        description: "Internal smoke-chain depth"
        required: false
        default: "0"
        type: string
      predecessor_run_id:
        description: "Run ID of the predecessor that dispatched this run"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write

# Completion-based collector chain.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false
  queue: max

jobs:
  collector:
    timeout-minutes: 350
    runs-on: ubuntu-latest
    env:
      COLLECTOR_RUN_SECONDS: "19200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Collect BTC_USDT Futures Trades
        id: collect
        if: ${{ inputs.run_mode == 'production' }}
        run: |
          python -u tabdeal_futures_ws_test.py

      - name: Smoke-chain step
        id: smoke
        if: ${{ inputs.run_mode == 'smoke' }}
        run: |
          set -euo pipefail
          depth="${{ inputs.smoke_depth }}"
          if ! [[ "$depth" =~ ^[0-9]+$ ]]; then
            echo "Invalid smoke_depth: $depth"
            exit 1
          fi
          echo "Smoke chain depth=$depth"
          if [ "$depth" -ge 2 ]; then
            echo "Smoke-chain terminal reached."
          fi
      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: |
            data/trades.csv
            data/archive
          if-no-files-found: warn
      - name: Claim one successor dispatch
        id: claim
        if: ${{ github.ref == 'refs/heads/main' && steps.collect.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CLAIM_KEY: "successor-${{ github.run_id }}"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/contents/.github/collector-handoff-claims/$CLAIM_KEY.json"
          payload="$(jq -n --arg run_id "${{ github.run_id }}" --arg sha "${{ github.sha }}" --arg claimed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{message:"collector: claim successor",content:($run_id+" "+$sha+" "+$claimed_at|@base64),branch:"main"}')"
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out "%{http_code}" --request PUT --url "$api" --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2026-03-10" --data "$payload")"
          case "$status" in
            201)
              echo "Successor claim acquired: $CLAIM_KEY"
              echo "claimed=true" >> "$GITHUB_OUTPUT"
              ;;
            409|422)
              echo "Successor claim already exists; duplicate dispatch suppressed."
              cat "$response"
              echo "claimed=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected claim API status=$status; fail closed."
              cat "$response"
              exit 1
              ;;
          esac

      - name: Dispatch next collector
        if: ${{ steps.collect.outcome == 'success' && steps.claim.outputs.claimed == 'true' || (inputs.run_mode == 'smoke' && steps.smoke.outcome == 'success' && fromJSON(inputs.smoke_depth || '0') < 2) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          next_depth="0"
          if [ "${{ inputs.run_mode }}" = "smoke" ]; then
            next_depth=$((${{ fromJSON(inputs.smoke_depth || '0') }} + 1))
          fi
          echo "Dispatching successor: mode=${{ inputs.run_mode }} depth=$next_depth ref=main"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{\"ref\":\"main\",\"inputs\":{\"run_mode\":\"${{ inputs.run_mode }}\",\"smoke_depth\":\"$next_depth\",\"predecessor_run_id\":\"${{ github.run_id }}\"}}"
