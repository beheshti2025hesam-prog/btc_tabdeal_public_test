name: Hes Trade Agent — Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

permissions:
  contents: write

# Collector safety boundary:
# - Exactly one collector run may execute at a time.
# - A running collector must NEVER be canceled by a newer run.
# - Manual dispatch uses the same lock to prevent concurrent CSV/archive writers.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false
  queue: max

jobs:
  collector:
    timeout-minutes: 350

    runs-on: ubuntu-latest

    env:
      COLLECTOR_RUN_SECONDS: "19200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          timeout --signal=TERM --kill-after=60s "${COLLECTOR_RUN_SECONDS}s" \
            python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: |
            data/trades.csv
            data/archive
          if-no-files-found: warn
