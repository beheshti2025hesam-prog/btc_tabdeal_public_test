name: Hes Trade Agent — Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

  schedule:
    # 24/7 collector cadence:
    # - Collector runtime: 5h20m (original proven collection window).
    # - A new scheduled run is created every 4h.
    # - This creates ~80m overlap, so scheduler delays are absorbed by the
    #   concurrency queue instead of becoming raw-data gaps.
    # - Schedule is intentionally offset from the top of the hour because
    #   GitHub documents higher schedule delay risk at :00.
    #
    # Schedule times are UTC.
    - cron: "15 00 * * *"
    - cron: "15 04 * * *"
    - cron: "15 08 * * *"
    - cron: "15 12 * * *"
    - cron: "15 16 * * *"
    - cron: "15 20 * * *"

permissions:
  contents: write

# Collector safety boundary:
# - Exactly one collector run may execute at a time.
# - A running collector must NEVER be canceled by a newer run.
# - Multiple pending runs must NOT replace/cancel each other.
#   queue: max preserves queued scheduled collectors.
#
# Manual dispatch intentionally uses the same lock so it cannot run beside
# a scheduled/pending collector and corrupt the shared CSV/archive state.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false
  queue: max

jobs:
  collector:
    timeout-minutes: 350

    runs-on: ubuntu-latest

    env:
      # Restore original 5h20m collection window.
      # 4h cadence => approximately 80m overlap/queue protection.
      COLLECTOR_RUN_SECONDS: "19200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          # The collector owns the normal 5h20m shutdown and performs the
          # final persistence checkpoint in Python. Do not wrap it in the
          # GNU timeout command: timeout returns exit 124 even when the
          # collector handles SIGTERM, closes the websocket, checkpoints,
          # and exits cleanly. The job-level timeout remains the hard fuse.
          python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: |
            data/trades.csv
            data/archive
          if-no-files-found: warn
