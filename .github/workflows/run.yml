name: Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

  schedule:
    # Run every 4h 48m.
    # Collector runs for 4h 30m.
    # This leaves approximately 18 minutes of buffer
    # before the next scheduled run is created.
    #
    # Schedule times are UTC.
    - cron: "00 00 * * *"
    - cron: "48 04 * * *"
    - cron: "36 09 * * *"
    - cron: "24 14 * * *"
    - cron: "12 19 * * *"

permissions:
  contents: write

# Keep only one Collector run active at a time.
# Do not cancel an older run: a scheduled run may be delayed by GitHub and
# must never interrupt a collector that is already persisting live data.
#
# IMPORTANT: manual dispatch uses the same lock intentionally. Running a
# manual collector beside a scheduled/pending collector could corrupt the
# shared CSV/archive state.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false

jobs:
  collector:
    timeout-minutes: 350

    runs-on: ubuntu-latest

    env:
      # 4h30m collection + ~18m schedule margin.
      COLLECTOR_RUN_SECONDS: "16200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: |
            data/trades.csv
            data/archive
          if-no-files-found: warn
