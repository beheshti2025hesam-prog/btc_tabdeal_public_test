name: Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

  schedule:
    # Run every 4h 48m.
    # Collector runs for 4h 20m.
    # This leaves approximately 28 minutes of buffer
    # before the next scheduled run is created.
    #
    # Schedule times are UTC.
    - cron: "00 00 * * *"
    - cron: "48 04 * * *"
    - cron: "36 09 * * *"
    - cron: "24 14 * * *"
    - cron: "12 19 * * *"

permissions:
  contents: write

# Keep only one Collector run active at a time.
# A later scheduled run may remain pending until the active run finishes.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false
  # GitHub's default queue keeps only one pending run and
  # replaces older pending runs. Keep a bounded FIFO queue
  # so scheduled collectors are not silently discarded.
  queue: max

jobs:
  collector:
    # Collector runtime is configured through an environment variable.
    # 15600 seconds = 4 hours 20 minutes.
    env:
      COLLECTOR_RUN_SECONDS: "15600"

    timeout-minutes: 350

    runs-on: ubuntu-latest

    env:
      # 4h30m collection + ~18m schedule margin.
      COLLECTOR_RUN_SECONDS: "16200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: data/trades.csv
          if-no-files-found: warn
