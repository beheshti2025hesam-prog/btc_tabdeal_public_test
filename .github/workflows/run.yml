name: Tabdeal Public API Test

on:
  workflow_dispatch:

  push:
    branches: ["main"]

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Tabdeal public API test
        run: python tabdeal_public_test.py
      - name: Run Tabdeal Futures WebSocket test
        run: timeout 20 python tabdeal_futures_ws_test.py
