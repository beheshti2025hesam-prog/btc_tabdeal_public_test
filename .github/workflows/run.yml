name: Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false

jobs:
  collector:

    timeout-minutes: 335

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: data/trades.csv
          if-no-files-found: warn
