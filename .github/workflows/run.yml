name: Hes Trade Agent — Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

  schedule:
    # 24/7 collector cadence:
    # - Collector runtime: 4h30m.
    # - Five starts per 24h, every 4h48m, gives ~18m intentional overlap.
    # - This keeps the collector continuously covered without creating a
    #   permanently growing concurrency backlog (runtime < cadence).
    # - Schedule is intentionally offset from :00 where possible because
    #   GitHub documents higher schedule-delay risk around the top of the hour.
    #
    # Schedule times are UTC.
    - cron: "00 00 * * *"
    - cron: "48 04 * * *"
    - cron: "36 09 * * *"
    - cron: "24 14 * * *"
    - cron: "12 19 * * *"

permissions:
  contents: write

# Collector safety boundary:
# - Exactly one collector run may execute at a time.
# - A running collector must NEVER be canceled by a newer run.
# - Multiple pending runs must NOT replace/cancel each other.
#   queue: max preserves queued scheduled collectors.
#
# Manual dispatch intentionally uses the same lock so it cannot run beside
# a scheduled/pending collector and corrupt the shared CSV/archive state.
concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false
  queue: max

jobs:
  collector:
    timeout-minutes: 300

    runs-on: ubuntu-latest

    env:
      # Stable 24/7 boundary: 4h30m runtime on a 4h48m cadence.
      COLLECTOR_RUN_SECONDS: "16200"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          timeout --signal=TERM --kill-after=60s "${COLLECTOR_RUN_SECONDS}s" \
            python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: |
            data/trades.csv
            data/archive
          if-no-files-found: warn
