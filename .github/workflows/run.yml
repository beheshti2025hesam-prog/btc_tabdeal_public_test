name: Tabdeal BTC Futures Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tabdeal-btc-usdt-collector
  cancel-in-progress: false

jobs:
  collector:

    # حداکثر زمان Job کمتر از سقف 6 ساعته GitHub
    timeout-minutes: 355

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect BTC_USDT Futures Trades
        run: |
          python -u tabdeal_futures_ws_test.py

      - name: Upload collected trades
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-btc-usdt-trades
          path: data/trades.csv
          if-no-files-found: warn

      - name: Save trades to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trades.csv

          if git diff --cached --quiet; then
            echo "No new trades to save."
          else
            git commit -m "Update Tabdeal BTC_USDT trade data"
            git push
          fi
