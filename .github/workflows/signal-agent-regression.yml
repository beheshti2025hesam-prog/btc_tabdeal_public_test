name: Signal Agent v1 Regression Tests

on:
  push:
    branches:
      - feat/forward-signal-agent-hardening-20261024
      - feat/hes-agent-entrypoint-integration-20261024
      - feat/gateio-signal-agent-canonical-integration-20261026
  pull_request:
    branches:
      - fix/browser-visible-candle-assertion-20261025
      - main
      - feat/native-ohlcv-candle-sources-20261017
      - feat/native-ohlcv-dashboard-single-path-20261021
      - feat/gateio-native-ohlcv-dashboard-adapter-20261025

permissions:
  contents: read

jobs:
  signal-agent-regression:
    name: Signal Agent + Existing Gate Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Signal Agent and adjacent policy regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            forward/test_signal_agent_v1.py \
            forward/test_strategy_policy_v1.py \
            forward/test_strategy_evidence_provider_v1.py \
            forward/test_order_block_v1.py \
            forward/test_confirmation_policy_v1.py \
            forward/test_opportunity_policy_v1.py \
            forward/test_risk_policy_v1.py \
            forward/test_decision_risk_integration_v1.py \
            forward/test_forward_e2e_boundary_v1.py \
            tests/forward/test_agent_disagreement_resolver_v1.py
      - name: Assert execution remains disabled
        run: |
          grep -q 'execution_disabled' forward/risk_policy_v1.py
          echo "SIGNAL_AGENT_REGRESSION=PASS"
          echo "LIVE_EXECUTION=OFF"
          echo "COLLECTOR_ACTIVATION=FORBIDDEN"
