name: Mother Orchestrator Integration

on:
  push:
    branches: ["feat/mother-orchestrator-integration-v1-20261025"]
  pull_request:
    branches: ["feat/evaluation-learning-evidence-integration-20261024"]

permissions:
  contents: read

jobs:
  mother-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test Mother, dashboard, risk-veto, journal and forward-evidence boundaries
        run: |
          python -m pytest -q \
            tests/test_mother_orchestrator_v1.py \
            tests/test_dashboard_routes_v1.py \
            tests/test_decision_engine_v1_risk_veto_invariants.py \
            tests/test_decision_gate_firewall_v1.py \
            tests/test_release_readiness_v1.py \
            tests/test_forward_observation_writer_v1.py \
            tests/test_forward_learning_loop_v1.py \
            tests/test_learning_evidence_adapter_v1.py
        env:
          PYTHONPATH: .
      - name: Verify immutable witness contract and fail-closed execution boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract_path = Path("core/orchestration/mother_contract_v1.json")
          evidence_path = Path("forward/clean_evidence_contract_v1.json")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))

          expected = [
              "data_quality", "market_structure", "signal", "confirmation",
              "risk", "decision", "evaluation",
          ]
          if contract.get("schema_version") != "hes.mother_orchestration.v1":
              raise SystemExit("WITNESS_SCHEMA_VERSION_INVALID")
          if contract.get("required_stage_order") != expected:
              raise SystemExit("WITNESS_STAGE_ORDER_DRIFT")
          if contract.get("execution_authorized") is not False:
              raise SystemExit("MOTHER_EXECUTION_BOUNDARY_VIOLATION")
          if evidence.get("execution_enabled") is not False:
              raise SystemExit("FORWARD_EXECUTION_BOUNDARY_VIOLATION")

          print("MOTHER_WITNESS_CONTRACT=PASS")
          print("STAGE_ORDER=PASS")
          print("EXECUTION=OFF")
          PY
