name: Mother Orchestrator Integration

on:
  push:
    branches: ["feat/mother-orchestrator-integration-v1-20261025"]
  pull_request:
    branches: ["feat/evaluation-learning-evidence-integration-20261024"]

permissions:
  contents: read

jobs:
  mother-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Test orchestration contract and integrated dashboard route
        run: |
          python -m pytest -q \
            tests/test_mother_orchestrator_v1.py \
            tests/test_dashboard_routes_v1.py
        env:
          PYTHONPATH: .
      - name: Assert no execution capability is introduced
        run: |
          grep -q '"execution_authorized": false' core/orchestration/mother_contract_v1.json
          grep -q '"execution_enabled": false' forward/clean_evidence_contract_v1.json
          echo "MOTHER_ORCHESTRATOR_INTEGRATION=PASS"
          echo "EXECUTION=OFF"
