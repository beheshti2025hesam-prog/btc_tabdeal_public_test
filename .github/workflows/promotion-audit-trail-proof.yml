name: Promotion Audit Trail Proof

on:
  push:
    branches:
      - "audit/promotion-audit-trail-proof"
  pull_request:
    paths:
      - "core/evaluation/promotion_audit.py"
      - "core/evaluation/evidence.py"
      - "core/evaluation/registry.py"
      - "core/evaluation/promotion_gate.py"
      - "core/evaluation/final_promotion_gate.py"
      - "core/evaluation/operational_safety.py"
      - "tests/evaluation/test_promotion_audit.py"
      - ".github/workflows/promotion-audit-trail-proof.yml"

jobs:
  promotion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q tests/evaluation/test_promotion_audit.py
