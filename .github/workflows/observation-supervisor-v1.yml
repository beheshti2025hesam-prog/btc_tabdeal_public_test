name: Dedicated Forward Observation Supervisor v1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervisor-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run isolated supervisor tests
        run: python -m pytest -q tests/test_observation_supervisor_v1.py
      - name: Assert hard boundaries
        run: |
          ! grep -nE 'create_order|api/v1/order|systemctl|websocket|requests\.' forward/observation_supervisor_v1.py
          grep -q 'execution_enabled' forward/observation_supervisor_v1.py
          echo "SUPERVISOR_LEDGER=PASS"
          echo "NETWORK_COLLECTION=OFF"
          echo "EXECUTION=OFF"
