name: HES Trade Agent — Source Identity Reconciliation v2
on:
  push:
    branches:
      - research/source-identity-reconciliation-v2-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_RAW_BLOB_SHA: "1a44d52a0588deb765bbbea04bfb5783dcb1050b"
      OLD_RAW_SOURCE_COMMIT: "b8c4fe4fa054dbfa4fca17d2f307d269c16335e1"
      CURRENT_RAW_BLOB_SHA: "58d21825e052dbaa42e7eb0695455c19997bff43"
      CURRENT_RAW_SOURCE_COMMIT: "b9ebecf061dfe9a084797d77b48a2c7846d269e3"
      PROTOCOL_CONTRACT_BLOB_SHA: "a84dafbc09c72ac37ebbbb0706b43d23f7681e12"
      PROTOCOL_CONTRACT_SOURCE_COMMIT: "e5f85f06b19b8427f761b95ab56ad15ccd7053c0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile locked identity against exact raw blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/source_identity_reconciliation_v2.py
      - name: Fail-closed validation
        run: |
          python - <<'PY'
          import json
          d=json.load(open("evidence/source_identity_reconciliation_v2.json"))
          assert d["claim_boundary"]["feature_extraction_performed"] is False
          assert d["claim_boundary"]["effective_evidence_performed"] is False
          assert d["claim_boundary"]["promotion"] is False
          print("SOURCE_IDENTITY_RECONCILIATION_V2_VALID")
          print("STATUS:", d["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-identity-reconciliation-v2
          path: |
            evidence/source_identity_reconciliation_v2.json
            evidence/source_identity_reconciliation_v2.lock.json
          if-no-files-found: error
