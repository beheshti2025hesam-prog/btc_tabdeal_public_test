name: Canonical Native OHLCV WebSocket Parser

on:
  pull_request:
    branches:
      - feat/native-ohlcv-candle-sources-20261017
    paths:
      - "forward/native_ohlcv_v1.py"
      - "forward/native_ohlcv_websocket_v1.py"
      - "tests/test_native_ohlcv_v1.py"
      - "tests/test_native_ohlcv_websocket_v1.py"
      - ".github/workflows/canonical-native-ohlcv-websocket-v1.yml"

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_native_ohlcv_v1.py tests/test_native_ohlcv_websocket_v1.py
