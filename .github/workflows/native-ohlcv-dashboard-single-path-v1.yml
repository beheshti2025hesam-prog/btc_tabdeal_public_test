name: Native OHLCV Dashboard Single Path v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-native-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run dashboard/native source and analysis path tests
        run: python -m pytest -q tests/test_dashboard_routes_v1.py tests/test_native_ohlcv_v1.py tests/test_native_ohlcv_feature_pipeline_v1.py tests/test_native_ohlcv_websocket_v1.py
