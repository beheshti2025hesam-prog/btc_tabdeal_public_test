name: Native OHLCV Dashboard Single Path v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-native-path:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
      - name: Install dashboard/API test dependencies
        run: python -m pip install --disable-pip-version-check pytest websocket-client==1.8.0
      - name: Run dashboard API, frontend contract, and native source acceptance
        run: >-
          python -m pytest -q
          tests/test_dashboard_routes_v1.py
          tests/test_dashboard_freshness_v1.py
          tests/test_dashboard_canonical_batch_provenance_v1.py
          tests/test_dashboard_localization_v1.py
          tests/test_dashboard_orders_placed_contract_v1.py
          tests/test_strategy_v2_dashboard_view.py
          tests/test_mother_v2_dashboard_view.py
          tests/test_native_ohlcv_v1.py
          tests/test_native_ohlcv_feature_pipeline_v1.py
          tests/test_native_ohlcv_websocket_v1.py
          tests/test_native_ohlcv_stream_transport_v1.py
          tests/test_native_ohlcv_stream_reconciliation_v1.py
          tests/test_native_ohlcv_gateio_v1.py
