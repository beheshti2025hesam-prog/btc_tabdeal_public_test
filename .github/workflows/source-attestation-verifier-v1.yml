name: Independent Source Attestation v1

on:
  push:
    branches:
      - security/independent-attestation-verifier-v1
  pull_request:
    branches:
      - main
      - feat/sequence-capability-registry-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestation-verifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier test dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Run adversarial detached-attestation tests
        run: python -m pytest -q tests/test_source_attestation_verifier_v1.py
