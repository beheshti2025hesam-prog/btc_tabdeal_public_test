name: Validation Pipeline Gate

on:
  push:
    branches: ["main", "validation-pipeline-gate-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validation-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run temporal validation and OOS walk-forward gate
        run: >-
          pytest -q
          tests/backtest/test_engine.py
          tests/backtest/test_validation.py
          tests/backtest/test_walk_forward.py
          tests/backtest/test_robustness.py
          tests/evaluation/test_boundary.py
          tests/evaluation/test_promotion_gate.py
        env:
          PYTHONPATH: .
