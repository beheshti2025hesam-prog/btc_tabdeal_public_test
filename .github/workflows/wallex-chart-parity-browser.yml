name: Wallex chart/API browser parity capture

on:
  push:
    branches: ["feat/wallex-candle-parity-core"]
    paths:
      - "tools/wallex_parity/capture_wallex_chart.py"
      - ".github/workflows/wallex-chart-parity-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture chart datafeed and compare same-window direct API
        run: python tools/wallex_parity/capture_wallex_chart.py
      - name: Upload raw captures, screenshot, and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallex-chart-api-parity-${{ github.sha }}
          path: artifacts/wallex-chart-parity/
          if-no-files-found: warn
          retention-days: 90
