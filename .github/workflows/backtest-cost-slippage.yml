name: HES Trade Agent — Backtest Cost & Slippage Boundary

on:
  push:
    branches:
      - backtest-cost-slippage-boundary-v1
  pull_request:
    branches:
      - main

jobs:
  cost-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/backtest/test_costs.py tests/backtest/test_cost_matrix.py tests/backtest/test_oos_protocol.py tests/backtest/test_oos_cost_matrix.py tests/backtest/test_engine.py tests/backtest/test_oos_snapshot_integrity.py
      - name: Run real-data 8-fold OOS cost matrix
        run: python scripts/run_real_oos_cost_matrix.py --csv data/trades.csv --output oos_cost_matrix_evidence.json
      - name: Upload OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-btcusdt-oos-cost-matrix-evidence
          path: oos_cost_matrix_evidence.json
          if-no-files-found: error
