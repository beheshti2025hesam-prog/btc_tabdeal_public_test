name: HES Trade Agent — Fresh Snapshot Integrity Gate v1

on:
  push:
    branches:
      - controlled-candidate-performance-study-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hes-fresh-snapshot-integrity-gate-v1
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute lineage lock validation
        run: python research/snapshot_integrity_execution_v1.py
