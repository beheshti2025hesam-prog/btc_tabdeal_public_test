name: Evidence Lineage Contract v1

on:
  push:
    branches:
      - security/evidence-lineage-contract-v1-20261013
  pull_request:
    branches:
      - main
      - security/evidence-lineage-contract-v1-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-lineage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run explicit lineage contract and hostile tests
        run: python -m pytest -q tests/test_evidence_lineage_contract_v1.py
      - name: Assert safe scope remains explicit
        run: |
          grep -q 'does not establish' forward/evidence_lineage_contract_v1.py
          echo "EVIDENCE_LINEAGE_CONTRACT=PASS"
          echo "NETWORK_COLLECTION=OFF"
          echo "EXECUTION=OFF"
