name: Binance Public Adapter Tests
on:
  push:
    branches: ["main", "feat/binance-public-market-data-adapter-v1"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_binance_public_adapter_v1.py
        env:
          PYTHONPATH: .
