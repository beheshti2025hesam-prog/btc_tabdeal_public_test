name: HES Trade Agent — Final Evidence Synthesis v1
on:
  push:
    branches:
      - research/final-evidence-synthesis-v1-20261005
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hes-final-evidence-synthesis-v1
  cancel-in-progress: false
jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_RAW_BLOB_SHA: 1a44d52a0588deb765bbbea04bfb5783dcb1050b
      OLD_RAW_SOURCE_COMMIT: b8c4fe4fa054dbfa4fca17d2f307d269c16335e1
      CURRENT_RAW_BLOB_SHA: 58d21825e052dbaa42e7eb0695455c19997bff43
      CURRENT_RAW_SOURCE_COMMIT: b9ebecf061dfe9a084797d77b48a2c7846d269e3
      PROTOCOL_CONTRACT_BLOB_SHA: a84dafbc09c72ac37ebbbb0706b43d23f7681e12
      PROTOCOL_CONTRACT_SOURCE_COMMIT: e5f85f06b19b8427f761b95ab56ad15ccd7053c0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize locked snapshots and contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]; h={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"}
          def blob(sha):
            q=urllib.request.Request(f"https://api.github.com/repos/{repo}/git/blobs/{sha}",headers=h)
            with urllib.request.urlopen(q) as r:d=json.load(r)
            assert d["sha"]==sha
            return base64.b64decode(d["content"])
          Path("/tmp/prior_trades.csv").write_bytes(blob(os.environ["OLD_RAW_BLOB_SHA"]))
          Path("/tmp/current_trades.csv").write_bytes(blob(os.environ["CURRENT_RAW_BLOB_SHA"]))
          Path("/tmp/protocol_contract.json").write_bytes(blob(os.environ["PROTOCOL_CONTRACT_BLOB_SHA"]))
          PY
      - name: Recompute prior locked population
        env:
          HES_FROZEN_CSV: /tmp/prior_trades.csv
          LOCKED_RAW_BLOB_SHA: ${{ env.OLD_RAW_BLOB_SHA }}
          LOCKED_RAW_SOURCE_COMMIT: ${{ env.OLD_RAW_SOURCE_COMMIT }}
          PROTOCOL_CONTRACT_SOURCE_COMMIT: ${{ env.PROTOCOL_CONTRACT_SOURCE_COMMIT }}
          PROTOCOL_CONTRACT_BLOB_SHA: ${{ env.PROTOCOL_CONTRACT_BLOB_SHA }}
          PROTOCOL_CONTRACT_PATH: /tmp/protocol_contract.json
        run: |
          python scripts/protocol_reconciliation_independent_snapshot_v1.py
          mv protocol_reconciliation_full_population_audit.json prior_1049_protocol.json
      - name: Recompute current locked population
        env:
          HES_FROZEN_CSV: /tmp/current_trades.csv
          LOCKED_RAW_BLOB_SHA: ${{ env.CURRENT_RAW_BLOB_SHA }}
          LOCKED_RAW_SOURCE_COMMIT: ${{ env.CURRENT_RAW_SOURCE_COMMIT }}
          PROTOCOL_CONTRACT_SOURCE_COMMIT: ${{ env.PROTOCOL_CONTRACT_SOURCE_COMMIT }}
          PROTOCOL_CONTRACT_BLOB_SHA: ${{ env.PROTOCOL_CONTRACT_BLOB_SHA }}
          PROTOCOL_CONTRACT_PATH: /tmp/protocol_contract.json
        run: |
          python scripts/protocol_reconciliation_independent_snapshot_v1.py
          mv protocol_reconciliation_full_population_audit.json current_1027_protocol.json
      - name: Run final synthesis
        run: python scripts/final_evidence_synthesis_v1.py
      - name: Validate fail-closed contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open("final_evidence_synthesis_v1.json"))
          assert d["population"]=={"prior_14":14,"current_28":28,"nominal_total":42}
          assert d["protocol"]["gross_threshold_bps"]==14
          assert d["claim_boundary"]["threshold_tuned"] is False
          assert d["claim_boundary"]["winner_reselected"] is False
          assert d["claim_boundary"]["records_deleted"] is False
          assert d["claim_boundary"]["promotion"] is False
          assert d["verdict"]["promotion"]=="BLOCKED"
          print("FINAL_EVIDENCE_SYNTHESIS_VALID")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-evidence-synthesis-v1
          path: final_evidence_synthesis_v1.json
          if-no-files-found: error
