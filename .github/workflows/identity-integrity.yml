name: HRS Trade Agent Identity Integrity

on:
  push:
    branches: ["main", "identity-hardening-20260925"]
  pull_request:
    branches: ["main"]

jobs:
  identity-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical identity
        run: python -m unittest discover -s tests -p "test_identity.py" -v
