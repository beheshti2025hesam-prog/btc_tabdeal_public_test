name: HES Trade Agent Identity Integrity

on:
  push:
    branches: ["main", "identity-hardening-20260925"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  identity-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || {
            echo "SOURCE_SHA_MISMATCH expected=$EXPECTED_SOURCE_SHA actual=$actual"
            exit 1
          }
          echo "CHECKED_OUT_SOURCE_SHA=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical identity
        run: python -m unittest discover -s tests -p "test_identity.py" -v
