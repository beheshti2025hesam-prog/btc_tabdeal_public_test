name: HES Trade Agent Identity Integrity

on:
  push:
    branches: ["main", "identity-hardening-20260925"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  identity-integrity:
    name: HES Trade Agent Identity Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify canonical identity
        run: python -m unittest discover -s tests -p "test_identity.py" -v
