name: Sequence Capability Registry v1

on:
  push:
    branches:
      - feat/sequence-capability-registry-v1
  pull_request:
    branches:
      - main
      - feat/dedicated-observation-supervisor-v1-20261010
      - feat/sequence-capability-registry-v1
      - impl/detached-source-attestation-v1-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Run adversarial registry and runner integration tests
        run: python -m pytest -q tests/test_sequence_capability_registry_v1.py tests/test_controlled_forward_observation_runner_v1.py tests/test_source_attestation_verifier_v1.py tests/test_independent_source_attestor_v1.py
