name: Sequence Capability Registry v1

on:
  push:
    branches:
      - feat/sequence-capability-registry-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run adversarial registry tests
        run: python -m pytest -q tests/test_sequence_capability_registry_v1.py
