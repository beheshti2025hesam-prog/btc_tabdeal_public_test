name: Dependency Security Audit

on:
  push:
    paths:
      - requirements.txt
      - .github/workflows/dependency-security-audit.yml
  pull_request:
    paths:
      - requirements.txt
      - .github/workflows/dependency-security-audit.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade package installer
        run: python -m pip install --upgrade pip
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Audit declared dependency graph
        run: pip-audit -r requirements.txt
