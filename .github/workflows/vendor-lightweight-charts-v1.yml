name: Vendor pinned Lightweight Charts v1

on:
  push:
    branches:
      - feat/native-ohlcv-dashboard-single-path-20261021
    paths:
      - .github/workflows/vendor-lightweight-charts-v1.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dashboard branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download the exact published npm package
        shell: bash
        run: |
          set -euo pipefail
          npm pack lightweight-charts@5.0.8 --silent
          mkdir -p /tmp/lwc-package
          tar -xzf lightweight-charts-5.0.8.tgz -C /tmp/lwc-package
          test -s /tmp/lwc-package/package/dist/lightweight-charts.standalone.production.js
          test -s /tmp/lwc-package/package/LICENSE
          test -s /tmp/lwc-package/package/NOTICE
      - name: Verify exact pinned asset integrity and vendor licenses
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/lwc-package/package/dist/lightweight-charts.standalone.production.js
          actual="$(openssl dgst -sha384 -binary "$src" | openssl base64 -A)"
          expected='8J8e9bGIwf7e9BLO5rwf4zJwNRKcypGnvuGzORD/t4TrFA1gWbl3Hsi/RvyWwBKl'
          test "$actual" = "$expected"
          dest=web/static/third_party/lightweight-charts/5.0.8
          mkdir -p "$dest"
          cp "$src" "$dest/lightweight-charts.standalone.production.js"
          cp /tmp/lwc-package/package/LICENSE "$dest/LICENSE"
          cp /tmp/lwc-package/package/NOTICE "$dest/NOTICE"
          cat > "$dest/README.md" <<'EOF'
          Vendored dependency: TradingView Lightweight Charts 5.0.8
          Source package: https://www.npmjs.com/package/lightweight-charts/v/5.0.8
          Official repository/tag: https://github.com/tradingview/lightweight-charts/tree/v5.0.8
          Build: dist/lightweight-charts.standalone.production.js
          SHA-384 (SRI base64): 8J8e9bGIwf7e9BLO5rwf4zJwNRKcypGnvuGzORD/t4TrFA1gWbl3Hsi/RvyWwBKl
          License: Apache-2.0. See LICENSE and NOTICE.
          Update only by changing the pinned package version and reviewed expected SHA-384.
          EOF
          test "$(openssl dgst -sha384 -binary "$dest/lightweight-charts.standalone.production.js" | openssl base64 -A)" = "$expected"
      - name: Commit vendored pinned library to this draft branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/static/third_party/lightweight-charts/5.0.8
          if git diff --cached --quiet; then
            echo "Pinned asset already exists; nothing to commit."
            exit 0
          fi
          git commit -m "[vendor-bot] vendor Lightweight Charts 5.0.8"
          git push origin "HEAD:$BRANCH"
