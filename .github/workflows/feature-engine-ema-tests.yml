name: Feature Engine EMA Tests

on:
  push:
    branches:
      - main
      - feature-engine-ema-integration-v1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run EMA contract tests
        run: python -m unittest discover -s tests/feature_engine -p "test_*.py" -v
