name: Evaluation and Learning Evidence Integration

on:
  pull_request:
    branches: ["main", "feat/hes-agent-entrypoint-integration-20261024", "feat/evaluation-learning-evidence-integration-20261024", "feat/trade-journal-readonly-ui-20261025"]
  push:
    branches: ["feat/evaluation-learning-evidence-integration-20261024", "feat/trade-journal-execution-projection-20261025"]

permissions:
  contents: read

jobs:
  evaluation-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run learning loop and real-path evidence adapter tests
        run: |
          python -m pytest -q \
            tests/test_forward_learning_loop_v1.py \
            tests/test_learning_evidence_adapter_v1.py \
            tests/test_dashboard_routes_v1.py \
            tests/test_trade_journal_view_v1.py tests/test_execution_journal_view_v1.py tests/test_trade_journal_outcome_view_v1.py tests/test_sqlite_backup_v1.py
      - name: Assert execution and historical firewalls
        run: |
          grep -q '"execution_enabled": false' forward/clean_evidence_contract_v1.json
          grep -q '"historical_inputs_allowed": false' forward/clean_evidence_contract_v1.json
          grep -q '"future_outcomes_allowed": false' forward/clean_evidence_contract_v1.json
          echo "LEARNING_EVIDENCE_INTEGRATION=PASS"
          echo "EXECUTION=OFF"
          echo "HISTORICAL_INPUTS=OFF"
