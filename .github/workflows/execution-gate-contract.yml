name: Execution Gate Contract Tests

on:
  pull_request:
    paths:
      - "forward/execution_gate_v1.py"
      - "tests/test_execution_gate_v1.py"
      - ".github/workflows/execution-gate-contract.yml"
  push:
    branches:
      - "feat/hes-live-execution-gates-20261024"

permissions:
  contents: read

jobs:
  execution-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run execution gate contract tests
        run: python -m pytest -q tests/test_execution_gate_v1.py
