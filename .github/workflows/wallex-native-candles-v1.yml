name: Wallex Native OHLCV Adapter v1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile adapter and tests
        run: python -m py_compile forward/wallex_native_candles_v1.py forward/test_wallex_native_candles_v1.py forward/wallex_candle_observation_v1.py forward/test_wallex_candle_observation_v1.py forward/wallex_native_feature_context_v1.py forward/test_wallex_native_feature_context_v1.py
      - name: Run deterministic offline tests
        run: python -m pytest -q forward/test_wallex_native_candles_v1.py forward/test_wallex_candle_observation_v1.py forward/test_wallex_native_feature_context_v1.py
      - name: Assert read-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("forward/wallex_native_candles_v1.py").read_text() + Path("forward/wallex_candle_observation_v1.py").read_text() + Path("forward/wallex_native_feature_context_v1.py").read_text()
          forbidden = ("/v1/account/orders", "X-API-Key", "create_order", "place_order")
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit("READ_ONLY_BOUNDARY_FAILED:" + ",".join(found))
          print("READ_ONLY_BOUNDARY=PASS")
          print("NETWORK_TESTS=NOT_RUN_IN_CI")
          print("EXECUTION=OFF")
          PY
