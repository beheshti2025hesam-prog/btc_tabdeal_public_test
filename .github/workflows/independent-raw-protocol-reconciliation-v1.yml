name: HES Trade Agent — Independent Immutable Raw Protocol Reconciliation v1

on:
  push:
    branches:
      - protocol-reconciliation-independent-snapshot-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hes-protocol-reconciliation-independent-snapshot
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCKED_RAW_BLOB_SHA: 58d21825e052dbaa42e7eb0695455c19997bff43
      LOCKED_RAW_SOURCE_COMMIT: b9ebecf061dfe9a084797d77b48a2c7846d269e3
      PROTOCOL_SOURCE_COMMIT: e5f85f06b19b8427f761b95ab56ad15ccd7053c0
      PROTOCOL_SOURCE_SCRIPT_BLOB: 5dfad504e6c699235ad696af67104b5be5176fef
      PROTOCOL_CONTRACT_SOURCE_COMMIT: e5f85f06b19b8427f761b95ab56ad15ccd7053c0
      PROTOCOL_CONTRACT_BLOB_SHA: a84dafbc09c72ac37ebbbb0706b43d23f7681e12
      HES_FROZEN_CSV: /tmp/hes_independent_trades.csv
    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize and hash-lock the independent Raw snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/beheshti2025hesam-prog/btc_tabdeal_public_test/git/blobs/${LOCKED_RAW_BLOB_SHA}" \
            > /tmp/raw_blob.json
          python - <<'PY'
          import base64, csv, hashlib, json, os
          from pathlib import Path
          d=json.load(open("/tmp/raw_blob.json"))
          assert d["sha"] == os.environ["LOCKED_RAW_BLOB_SHA"]
          raw=base64.b64decode(d["content"])
          assert raw
          p=Path(os.environ["HES_FROZEN_CSV"])
          p.write_bytes(raw)
          rows=list(csv.DictReader(p.open("r",encoding="utf-8",newline="")))
          assert rows
          seq=[int(r["sequence"]) for r in rows]
          ts=[r["updated"] for r in rows]
          manifest={
            "status":"IMMUTABLE_NEW_RAW_SNAPSHOT_HASH_LOCKED",
            "raw_path":"data/trades.csv",
            "source_commit":os.environ["LOCKED_RAW_SOURCE_COMMIT"],
            "git_blob_sha":os.environ["LOCKED_RAW_BLOB_SHA"],
            "sha256":hashlib.sha256(raw).hexdigest(),
            "bytes":len(raw),
            "rows":len(rows),
            "first_timestamp":ts[0],
            "last_timestamp":ts[-1],
            "first_sequence":seq[0],
            "last_sequence":seq[-1],
            "sequence_nonmonotonic_count":sum(b<=a for a,b in zip(seq,seq[1:])),
            "timestamp_backward_count":sum(b<a for a,b in zip(ts,ts[1:])),
            "duplicate_sequence_count":len(seq)-len(set(seq)),
            "safety":{"execution":False,"threshold_tuning":False,"model_fitting":False,"promotion":False}
          }
          assert manifest["sequence_nonmonotonic_count"]==0
          assert manifest["timestamp_backward_count"]==0
          assert manifest["duplicate_sequence_count"]==0
          Path("independent_raw_snapshot_lock.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Hash-lock the frozen protocol contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          sha = os.environ["PROTOCOL_CONTRACT_BLOB_SHA"]
          url = f"https://api.github.com/repos/beheshti2025hesam-prog/btc_tabdeal_public_test/git/blobs/{sha}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as resp:
              d = json.load(resp)
          assert d["sha"] == sha
          raw = base64.b64decode(d["content"])
          digest = hashlib.sha256(raw).hexdigest()
          open("/tmp/protocol_reconciliation_v1_contract.json","wb").write(raw)
          print(json.dumps({
              "protocol_contract_blob_sha": d["sha"],
              "protocol_contract_sha256": digest,
              "source_commit": os.environ["PROTOCOL_CONTRACT_SOURCE_COMMIT"]
          }, indent=2))
          PY

      - name: Run the frozen protocol against the complete population
        run: python scripts/protocol_reconciliation_independent_snapshot_v1.py

      - name: Fail closed on protocol/source mismatch and verify full-population reconciliation
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open("protocol_reconciliation_full_population_audit.json"))
          p=d["protocol"]; c=d["counts"]; pop=d["population"]
          assert p["train"]==800 and p["test"]==400 and p["step"]==400 and p["folds"]==8
          assert p["gross_threshold"]==0.0014
          assert p["snapshot_data_blob_sha"]==os.environ["LOCKED_RAW_BLOB_SHA"]
          assert p["snapshot_source_commit"]==os.environ["LOCKED_RAW_SOURCE_COMMIT"]
          assert c["winners_gt_14bps"] + c["controls_le_14bps"] == pop["evaluated_oos"]
          assert pop["evaluated_oos"] <= 8*400
          assert pop["evaluated_oos"] > 0
          assert len(d["winners"]) == c["winners_gt_14bps"]
          print("INDEPENDENT_RAW_PROTOCOL_RECONCILIATION_VALID")
          print(json.dumps({"evaluated_oos":pop["evaluated_oos"],"winners_gt_14bps":c["winners_gt_14bps"],"controls_le_14bps":c["controls_le_14bps"],"folds":p["folds"]},indent=2))
          PY

      - name: Assert full-population cost matrix
        run: |
          python - <<'PY'
          import json
          d=json.load(open("protocol_reconciliation_full_population_audit.json"))
          assert d["population"]["evaluated_oos"] == 1027
          assert d["counts"]["winners_gt_14bps"] == 28
          assert d["counts"]["controls_le_14bps"] == 999
          cm=d["cost_matrix"]["scenarios"]
          assert set(cm) == {"0bps_fee_0bps_slippage","5bps_fee_2bps_slippage_per_side","10bps_fee_5bps_slippage_per_side"}
          for x in cm.values():
              assert x["evaluated"] == 1027
              assert x["wins"] + x["losses"] == 1027
          print(json.dumps(cm,indent=2))
          PY

      - name: Upload immutable snapshot lock and complete audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: independent-raw-protocol-reconciliation-v1
          path: |
            independent_raw_snapshot_lock.json
            protocol_reconciliation_full_population_audit.json
            protocol_reconciliation_winners.csv
          if-no-files-found: error
