name: Historical Validation Tests

on:
  push:
    branches: ["main", "historical-validation-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/backtest/test_validation.py tests/backtest/test_engine.py
        env:
          PYTHONPATH: .
