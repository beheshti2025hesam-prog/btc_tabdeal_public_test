name: Snapshot Manifest Integrity

on:
  push:
    branches:
      - "snapshot-manifest-integrity-v1"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: snapshot-manifest-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot-manifest-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pytest

      - name: Unit integrity gate
        run: pytest -q tests/evaluation/test_snapshot_manifest_integrity.py
        env:
          PYTHONPATH: .

      - name: Build immutable manifest
        run: |
          python tools/snapshot_manifest_integrity.py             --snapshot evidence/1049_observation_raw_lineage_snapshot_v1.json             --manifest-out evidence/snapshot_manifest.generated.json             --check-git-blob 423435763eaee15275369d4dbe0ffe44dea0960e

      - name: Publish manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-manifest-integrity-v1
          path: evidence/snapshot_manifest.generated.json
          if-no-files-found: error
