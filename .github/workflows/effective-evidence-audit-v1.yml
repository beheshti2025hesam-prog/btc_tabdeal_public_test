name: HES Trade Agent — Effective Evidence Audit v1
on:
  workflow_run:
    workflows:
      - HES Trade Agent — Concentration Sensitivity Audit v1
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download locked prerequisite artifact
        uses: actions/download-artifact@v5
        with:
          name: concentration-sensitivity-audit-v1
          path: ${{ runner.temp }}/concentration-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize prerequisite artifact
        run: |
          test -f "${{ runner.temp }}/concentration-artifact/concentration_sensitivity_audit_v1.json"
          cp "${{ runner.temp }}/concentration-artifact/concentration_sensitivity_audit_v1.json" .
      - name: Run Effective Evidence audit
        run: python scripts/effective_evidence_audit_v1.py
      - name: Validate fail-closed boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open("effective_evidence_audit_v1.json"))
          assert d["raw_population"]["combined"]==42
          assert d["claim_boundary"]["independence_proven"] is False
          assert d["claim_boundary"]["promotion"]=="BLOCKED"
          assert d["final_verdict"]=="EVIDENCE_INSUFFICIENT_FOR_PROMOTION"
          print("EFFECTIVE_EVIDENCE_AUDIT_VALID")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: effective-evidence-audit-v1
          path: effective_evidence_audit_v1.json
