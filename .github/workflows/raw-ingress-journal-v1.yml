name: Raw Ingress Journal v1

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/raw-ingress-rejected-event-journal-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-ingress-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/collector/test_raw_ingress_journal_v1.py
