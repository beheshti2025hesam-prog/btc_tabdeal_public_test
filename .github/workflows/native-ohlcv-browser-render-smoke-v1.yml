name: Native OHLCV Browser Render Smoke v1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only transport dependency
        run: python -m pip install --disable-pip-version-check -r requirements-market-data.txt
      - name: Start read-only dashboard
        shell: bash
        run: |
          set -euo pipefail
          nohup env PYTHONPATH=. HES_BINANCE_STREAM_ENABLED=0 python -m web.dashboard >/tmp/hes-dashboard-browser-smoke.log 2>&1 &
          echo $! >/tmp/hes-dashboard-browser-smoke.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hes-dashboard-browser-smoke.log
          exit 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        timeout-minutes: 4
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          # GitHub-hosted Ubuntu runners already include Chromium's system libraries;
          # install only the pinned browser binary here to avoid a slow apt dependency pass.
          npx playwright install chromium
      - name: Render real chart and compare chart input with same API batch
        timeout-minutes: 2
        run: |
          mkdir -p artifacts
          node scripts/test_native_ohlcv_dashboard_browser_smoke.cjs
      - name: Upload browser evidence and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ohlcv-dashboard-browser-smoke-${{ github.sha }}
          path: |
            artifacts/native-ohlcv-dashboard-browser-smoke.json
            artifacts/native-ohlcv-dashboard-browser-smoke.png
            /tmp/hes-dashboard-browser-smoke.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop read-only dashboard
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/hes-dashboard-browser-smoke.pid ]; then kill "$(cat /tmp/hes-dashboard-browser-smoke.pid)" 2>/dev/null || true; fi
