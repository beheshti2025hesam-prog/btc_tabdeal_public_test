name: Controlled Signal Research v1

on:
  push:
    branches: ["controlled-signal-research-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/research/test_controlled_signal_contract.py
        env:
          PYTHONPATH: .
