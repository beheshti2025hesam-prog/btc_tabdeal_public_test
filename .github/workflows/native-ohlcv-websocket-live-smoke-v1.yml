name: Native OHLCV WebSocket Live Smoke v1

on:
  push:
    branches:
      - test/native-ohlcv-websocket-live-20261025
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-websocket-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install read-only transport dependency
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Capture one closed Spot kline and reconcile against REST
        timeout-minutes: 3
        env:
          PYTHONPATH: .
        run: python scripts/capture_native_ohlcv_websocket_smoke.py --timeout-seconds 120
      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ohlcv-websocket-smoke-${{ github.sha }}
          path: evidence/native_ohlcv_websocket_smoke.json
          if-no-files-found: warn
          retention-days: 14
