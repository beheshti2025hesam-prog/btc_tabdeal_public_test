name: Legacy Binance Spot WebSocket Smoke (manual only; not Gate.io acceptance)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-websocket-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install read-only transport dependency
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Capture one closed Spot kline and reconcile against REST
        timeout-minutes: 3
        env:
          PYTHONPATH: .
        run: python scripts/capture_native_ohlcv_websocket_smoke.py --timeout-seconds 120
      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ohlcv-websocket-smoke-${{ github.sha }}
          path: evidence/native_ohlcv_websocket_smoke.json
          if-no-files-found: warn
          retention-days: 14
