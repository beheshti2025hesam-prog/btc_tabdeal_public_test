name: Global Market Data Adapter Tests
on:
  pull_request:
    branches: ["main"]
    paths:
      - "forward/global_market_data_v1.py"
      - "tests/test_global_market_data_v1.py"
      - ".github/workflows/global-market-data-tests.yml"
      - "docs/PROJECT_DNA.md"
      - "docs/roadmap/APP_DELIVERY_PLAN_AND_CHART_SLICE_ACCEPTANCE_2026-10-20.md"
      - "docs/roadmap/TRADINGVIEW_COMPARABLE_CHART_DATAFEED_GATE_V1_2026-10-19.md"
  push:
    branches: ["feat/global-market-data-and-safety-gates-20261020"]
    paths:
      - "forward/global_market_data_v1.py"
      - "tests/test_global_market_data_v1.py"
      - ".github/workflows/global-market-data-tests.yml"
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_global_market_data_v1.py tests/test_native_candle_bridge_v1.py tests/test_decision_gate_firewall_v1.py tests/test_decision_engine_v1_risk_veto_invariants.py forward/test_decision_risk_integration_v1.py tests/execution/test_contract.py tests/execution/test_idempotency.py tests/execution/test_order_state.py
      - name: Live read-only public market-data smoke test
        env:
          PYTHONPATH: .
        run: python scripts/verify_global_market_data_v1.py
