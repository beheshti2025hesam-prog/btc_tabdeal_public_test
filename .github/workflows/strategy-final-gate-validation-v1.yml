name: Strategy Final Gate and Forward Runner Safety v1

on:
  pull_request:
  push:
    branches:
      - fix/strategy-final-gate-20261025

permissions:
  contents: read

jobs:
  strategy-final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline-test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests websocket-client==1.8.0
      - name: Run strategy, runner safety, reader, and soak-audit tests
        run: >-
          python -m pytest -q
          tests/strategy/test_policy_v2.py
          tests/strategy/test_strategy_policy_final_gate_v1.py
          tests/strategy/test_gateio_snapshot_breakout_window_v1.py
          tests/strategy/test_strategy_policy_runner_safety_v1.py
          tests/collector/test_global_market_data_reader_v1.py
          tests/collector/test_gateio_soak_audit_v2.py
          tests/collector/test_global_market_data_gateio_v1.py
          tests/collector/test_gateio_analysis_decision_v1.py
