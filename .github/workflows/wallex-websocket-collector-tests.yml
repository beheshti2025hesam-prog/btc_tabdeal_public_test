name: Wallex WebSocket Collector Session Isolation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "forward/wallex_market_data_collector_v1.py"
      - "forward/wallex_socketio_transport_v1.py"
      - "forward/wallex_controlled_observation_runner_v1.py"
      - "forward/session_epoch_gate_v1.py"
      - "docs/registry/wallex_spot_market_data_2026-10-18.yaml"
      - "docs/checkpoints/CANDLE_FIRST_NATIVE_WALLEX_2026-10-18.md"
      - "tests/test_wallex_market_data_collector_v1.py"
      - "tests/test_wallex_socketio_transport_v1.py"
      - "tests/test_wallex_controlled_observation_runner_v1.py"
      - "tests/test_session_epoch_gate_v1.py"
      - "evidence/wallex_collector_live_epoch_integration_20261018.json"
      - "evidence/wallex_collector_live_epoch_integration_20261018.json.sha256"
      - "evidence/wallex_controlled_observation_20261018.jsonl"
      - "evidence/wallex_controlled_observation_20261018.jsonl.sha256"
      - "evidence/wallex_controlled_observation_20261018.manifest.json"
      - "evidence/wallex_controlled_observation_20261018.manifest.json.sha256"
      - "evidence/wallex_quality_clock_sync_20261018.json"
      - "evidence/wallex_quality_clock_sync_20261018.json.sha256"
      - "evidence/wallex_official_socketio_reachability_20261018.json"
      - "evidence/wallex_official_socketio_reachability_20261018.json.sha256"
      - ".github/workflows/wallex-websocket-collector-tests.yml"
  push:
    branches: ["fix/wallex-session-epoch-gate"]
    paths:
      - "forward/wallex_market_data_collector_v1.py"
      - "forward/wallex_socketio_transport_v1.py"
      - "forward/wallex_controlled_observation_runner_v1.py"
      - "forward/session_epoch_gate_v1.py"
      - "tests/test_wallex_market_data_collector_v1.py"
      - "tests/test_wallex_socketio_transport_v1.py"
      - "tests/test_wallex_controlled_observation_runner_v1.py"
      - "tests/test_session_epoch_gate_v1.py"
      - "evidence/wallex_collector_live_epoch_integration_20261018.json"
      - "evidence/wallex_collector_live_epoch_integration_20261018.json.sha256"
      - "evidence/wallex_controlled_observation_20261018.jsonl"
      - "evidence/wallex_controlled_observation_20261018.jsonl.sha256"
      - "evidence/wallex_controlled_observation_20261018.manifest.json"
      - "evidence/wallex_controlled_observation_20261018.manifest.json.sha256"
      - "evidence/wallex_quality_clock_sync_20261018.json"
      - "evidence/wallex_quality_clock_sync_20261018.json.sha256"
      - "evidence/wallex_official_socketio_reachability_20261018.json"
      - "evidence/wallex_official_socketio_reachability_20261018.json.sha256"
      - ".github/workflows/wallex-websocket-collector-tests.yml"

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run session-isolation and Wallex transport tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_wallex_market_data_collector_v1.py tests/test_wallex_socketio_transport_v1.py tests/test_wallex_controlled_observation_runner_v1.py tests/test_session_epoch_gate_v1.py tests/test_native_wallex_ohlcv_v1.py
      - name: Verify pinned live evidence
        run: (cd evidence && sha256sum -c wallex_collector_live_epoch_integration_20261018.json.sha256 && sha256sum -c wallex_controlled_observation_20261018.jsonl.sha256 && sha256sum -c wallex_controlled_observation_20261018.manifest.json.sha256 && sha256sum -c wallex_quality_clock_sync_20261018.json.sha256 && sha256sum -c wallex_official_socketio_reachability_20261018.json.sha256)
