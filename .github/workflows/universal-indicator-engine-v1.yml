name: Universal Indicator Engine V1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'forward/universal_indicator_engine_v1.py'
      - 'forward/universal_indicator_engine_v1.json'
      - 'tests/test_universal_indicator_engine_v1.py'
      - 'tests/test_universal_indicator_reference_parity_v1.py'
      - 'web/dashboard.py'
      - 'web/static/dashboard.js'
      - 'web/static/dashboard.css'
      - 'scripts/test_universal_indicator_dashboard_*.cjs'
      - '.github/workflows/universal-indicator-engine-v1.yml'
  push:
    paths:
      - 'forward/universal_indicator_engine_v1.py'
      - 'forward/universal_indicator_engine_v1.json'
      - 'tests/test_universal_indicator_engine_v1.py'
      - 'tests/test_universal_indicator_reference_parity_v1.py'
      - 'web/dashboard.py'
      - 'web/static/dashboard.js'
      - 'web/static/dashboard.css'
      - 'scripts/test_universal_indicator_dashboard_*.cjs'
      - '.github/workflows/universal-indicator-engine-v1.yml'

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Formula parity and full regression suite
        run: |
          python -m pytest -q -W error tests/test_universal_indicator_engine_v1.py tests/test_universal_indicator_reference_parity_v1.py
          python -m pytest -q -W error
      - name: Python compile
        run: python -m py_compile web/dashboard.py forward/universal_indicator_engine_v1.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
      - name: Install isolated browser test dependencies
        run: npm install --prefix validation-tools --no-save --no-package-lock playwright@1.56.1 jsdom@26.1.0
      - name: DOM, localization and fail-closed smoke
        run: node scripts/test_universal_indicator_dashboard_dom_v1.cjs
      - name: Install Chromium for browser acceptance
        run: validation-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Desktop, Persian RTL, mobile and fail-closed browser acceptance
        run: node scripts/test_universal_indicator_dashboard_browser_v1.cjs
      - name: JavaScript syntax
        run: |
          node --check web/static/dashboard.js
          node --check scripts/test_universal_indicator_dashboard_dom_v1.cjs
          node --check scripts/test_universal_indicator_dashboard_browser_v1.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: universal-indicator-engine-v1-browser-evidence
          path: |
            artifacts/universal-indicator-dashboard-*.png
            artifacts/universal-indicator-dashboard-browser-report.json
          if-no-files-found: warn
