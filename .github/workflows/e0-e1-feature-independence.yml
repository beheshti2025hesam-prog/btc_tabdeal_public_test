name: HES Trade Agent — E0/E1 Independence-adjusted Feature Contrast

on:
  push:
    branches:
      - embargo-adjusted-fold-regime-independence-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e0-e1-feature-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      HES_FROZEN_CSV: /tmp/hes_frozen_trades.csv
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest

      - name: Materialize immutable frozen OOS snapshot
        run: |
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/beheshti2025hesam-prog/btc_tabdeal_public_test/git/blobs/1a44d52a0588deb765bbbea04bfb5783dcb1050b > /tmp/hes_blob.json
          python -c 'import base64,json; d=json.load(open("/tmp/hes_blob.json")); assert d["sha"]=="1a44d52a0588deb765bbbea04bfb5783dcb1050b"; open("/tmp/hes_frozen_trades.csv","wb").write(base64.b64decode(d["content"]))'
          test -s /tmp/hes_frozen_trades.csv

      - name: Run regression tests
        run: |
          python -m pytest -q             tests/backtest/test_embargo_adjusted_fold_regime_independence.py

      - name: Build frozen E0 feature contrast
        run: python scripts/contrast_audit_14_vs_1035.py

      - name: Build E1 embargo-adjusted independence evidence
        run: python scripts/embargo_adjusted_fold_regime_independence.py

      - name: Connect E0 feature contrast to E1 independence + LOO
        run: python scripts/independence_adjusted_feature_contrast_evidence.py

      - name: Upload E0 feature contrast
        uses: actions/upload-artifact@v4
        with:
          name: e0-14-vs-1035-feature-contrast
          path: |
            14_vs_1035_contrast_audit.json
            14_vs_1035_winners.csv
          if-no-files-found: error

      - name: Upload E1 embargo independence
        uses: actions/upload-artifact@v4
        with:
          name: e1-embargo-adjusted-fold-regime-independence
          path: embargo_adjusted_fold_regime_independence.json
          if-no-files-found: error

      - name: Upload combined independence-adjusted feature evidence
        uses: actions/upload-artifact@v4
        with:
          name: independence-adjusted-feature-contrast-evidence
          path: independence_adjusted_feature_contrast_evidence.json
          if-no-files-found: error

# Evidence-only gate. No Signal construction, tuning, fitting, live execution, or promotion.
