name: HES Trade Agent — Attestation Contract Negative Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "hes_attestation/**"
      - "tests/test_attestation_contract.py"
      - ".github/workflows/attestation-contract-tests.yml"
  push:
    branches: [safety/attestation-contract-negative-tests-main-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested source commit
        uses: actions/checkout@v4
        with:
          # pull_request GITHUB_SHA is normally a synthetic merge commit.
          # Test the PR head itself; for push/manual runs use the triggering SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=42,<47"
      - name: Run positive and negative contract tests
        run: python -m unittest discover -s tests -p "test_attestation_contract.py" -v
      - name: Assert and print exact verification identity
        env:
          EXPECTED_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          checked_out = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected = os.environ["EXPECTED_TEST_SHA"]
          identity = {
              "event_sha": os.environ.get("GITHUB_SHA"),
              "expected_test_sha": expected,
              "checked_out_sha": checked_out,
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          print(json.dumps(identity, indent=2))
          if checked_out != expected:
              print("FAIL: checked-out SHA does not match expected tested source SHA", file=sys.stderr)
              sys.exit(1)
          print("PASS: exact tested source SHA verified")
          PY
