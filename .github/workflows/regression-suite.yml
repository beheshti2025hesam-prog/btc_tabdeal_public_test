name: HES Full Regression Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "feat/hes-full-regression-gate-v1-20261103"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hes-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: HES Full Regression Gate / full-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify immutable workflow action references
        run: python scripts/check_workflow_action_pins.py

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run canonical full regression gate
        run: bash scripts/run_regression_suite.sh
