name: Binance Public Clock Diagnostic

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/binance_public_clock_probe.py"
      - "tests/test_binance_public_clock_probe.py"
      - ".github/workflows/binance-public-clock-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q tests/test_binance_public_clock_probe.py

  live-read-only-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare public server clocks and latest BTCUSDT 1m candles
        run: python tools/binance_public_clock_probe.py
