name: Gate.io Global Feed Input Validation v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateio-feed-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline-test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests websocket-client==1.8.0
      - name: Run Gate.io source, reader, and decision tests
        run: python -m pytest -q tests/collector/test_global_market_data_gateio_v1.py tests/collector/test_global_market_data_reader_v1.py tests/collector/test_gateio_analysis_decision_v1.py
      - name: Run continuous-soak audit tests
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'fix/audit-gateio-soak-continuity-20261025' || github.event.pull_request.head.ref == 'fix/strategy-final-gate-20261025')
        run: python -m pytest -q tests/collector/test_gateio_soak_audit_v2.py
      # Exact-head safety tests for the strategy candidate; no runner is started.
      - name: Run strategy final-gate and runner safety tests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/strategy-final-gate-20261025'
        run: >-
          python -m pytest -q
          tests/strategy/test_policy_v2.py
          tests/strategy/test_strategy_policy_final_gate_v1.py
          tests/strategy/test_gateio_snapshot_breakout_window_v1.py
          tests/strategy/test_strategy_policy_runner_safety_v1.py
