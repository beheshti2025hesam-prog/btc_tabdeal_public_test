name: Clean Forward Evidence Verification v1

on:
  pull_request:
    branches:
      - main
      - forward/integration-gate-test-2026-10-07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run clean evidence boundary tests
        run: |
          python -m pytest -q \
            tests/test_clean_evidence_collection_v1.py \
            tests/test_clean_evidence_candle_gate_v1.py \
            tests/test_clean_evidence_sequence_gate_v1.py \
            tests/test_forward_observation_writer_v1.py \
            tests/test_controlled_observation_run_v1.py
      - name: Verify forward-only contract
        run: |
          test -f forward/clean_evidence_contract_v1.json
          grep -q '"historical_inputs_allowed": false' forward/clean_evidence_contract_v1.json
          grep -q '"future_outcomes_allowed": false' forward/clean_evidence_contract_v1.json
          grep -q '"execution_enabled": false' forward/clean_evidence_contract_v1.json
          grep -q '"collector_auto_start": false' forward/clean_evidence_contract_v1.json
          echo "CLEAN_FORWARD_EVIDENCE_BOUNDARY=PASS"
          echo "LIVE_EXECUTION=OFF"
          echo "COLLECTOR_AUTO_START=OFF"
