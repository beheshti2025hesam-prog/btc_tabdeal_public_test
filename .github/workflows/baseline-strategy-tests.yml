name: Baseline Strategy Contract Tests

on:
  push:
    branches: ["main", "baseline-strategy-contract-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  baseline-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/strategy/test_baseline.py
        env:
          PYTHONPATH: .
