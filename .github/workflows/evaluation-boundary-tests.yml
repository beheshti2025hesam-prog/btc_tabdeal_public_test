name: Evaluation Boundary Tests

on:
  push:
    branches: ["main", "backtest-evaluation-boundary-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  evaluation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/evaluation/test_boundary.py
        env:
          PYTHONPATH: .
