name: Evaluation Boundary Tests

on:
  push:
    branches: ["main", "backtest-evaluation-boundary-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  evaluation-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/evaluation/test_boundary.py
        env:
          PYTHONPATH: .
