name: Native OHLCV Live Parity Evidence v1

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "evidence/native_ohlcv_live_parity_*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SOURCE_SHA=$EXPECTED_SOURCE_SHA"
          echo "CHECKED_OUT_SOURCE_SHA=$actual"
          test "$actual" = "$EXPECTED_SOURCE_SHA"

      - name: Capture bounded live public candle parity
        env:
          HES_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HES_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python scripts/capture_native_ohlcv_live_parity.py

      - name: Upload raw-response-hash and closed-candle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ohlcv-live-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/native_ohlcv_live_parity.json
          if-no-files-found: error
          retention-days: 30
