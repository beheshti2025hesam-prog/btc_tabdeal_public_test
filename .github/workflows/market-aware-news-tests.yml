name: Market-Aware News Intelligence Tests
on:
  push:
    branches: ["main", "feat/market-aware-news-intelligence-v1"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  news-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/news_engine/test_market_news_v1.py
        env:
          PYTHONPATH: .
