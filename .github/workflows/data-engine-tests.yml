name: Data Engine Tests

on:
  push:
    branches:
      - data-engine-v1
  pull_request:
    branches:
      - data-engine-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Data Engine tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/data_engine
