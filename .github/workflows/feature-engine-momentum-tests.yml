name: Feature Engine Momentum Tests

on:
  push:
    branches: ["main", "feature-engine-momentum-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  feature-engine-momentum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/feature_engine/test_momentum.py
        env:
          PYTHONPATH: .
