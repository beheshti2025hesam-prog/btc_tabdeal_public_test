name: Native Candle Bridge v1

on:
  push:
    branches:
      - feat/native-candle-bridge-v1-20261019
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_CHECKOUT_SHA=$EXPECTED_SHA"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run bridge tests
        run: python -m pytest -q tests/test_native_candle_bridge_v1.py
