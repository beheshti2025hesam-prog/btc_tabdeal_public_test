name: Binance OHLCV Exact-SHA Live Evidence
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "core/data_engine/binance_ohlcv.py"
      - "tests/data_engine/test_binance_ohlcv.py"
      - ".github/workflows/binance-ohlcv-exact-sha-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-sha-tests-and-public-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source identity
        run: |
          printf 'checked_out_sha='
          git rev-parse HEAD
          printf 'event_sha=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Binance adapter tests on exact checked-out SHA
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/data_engine/test_binance_ohlcv.py
      - name: Capture official public Spot and USDⓈ-M raw responses
        run: |
          python - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.error, urllib.request
          out = pathlib.Path("binance-live-evidence")
          out.mkdir()
          manifest = {
              "captured_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit": __import__("subprocess").check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "requests": []
          }
          endpoints = [
              ("spot", "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=10"),
              ("usdm", "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=10"),
          ]
          for market, url in endpoints:
              item = {"market": market, "url": url, "request_started_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "HES-Trade-Agent-readonly-validation/1.0"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      raw = response.read()
                      item.update({"http_status": response.status, "content_type": response.headers.get("Content-Type"), "received_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
                  (out / f"{market}_BTCUSDT_15m_raw.json").write_bytes(raw)
                  parsed = json.loads(raw)
                  item["json_rows"] = len(parsed) if isinstance(parsed, list) else None
                  if not isinstance(parsed, list) or not parsed:
                      item["error"] = "Response was not a non-empty JSON array"
              except Exception as exc:
                  item.update({"failed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(), "error_type": type(exc).__name__, "error": str(exc)})
              manifest["requests"].append(item)
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          if not any(x.get("http_status") == 200 and x.get("json_rows", 0) for x in manifest["requests"]):
              raise SystemExit("No successful official Binance raw response captured")
          PY
      - name: Upload raw response and provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-live-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: binance-live-evidence/
          if-no-files-found: warn
          retention-days: 14
