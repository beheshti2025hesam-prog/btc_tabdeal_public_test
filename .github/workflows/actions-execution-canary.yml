name: HES Trade Agent — Actions Execution Canary
on:
  push:
    branches: [main, research/actions-execution-canary-20261005]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify immutable workflow action references
        run: python3 scripts/check_workflow_action_pins.py
      - name: Confirm Actions runner execution
        run: echo "HES_ACTIONS_EXECUTION_CANARY_OK"
