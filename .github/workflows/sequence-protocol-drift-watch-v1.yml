name: HES Sequence Protocol Drift Watch v1

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - exchange-api-announcement
      - schema-observed
      - protocol-version-change
  push:
    branches: [main]
    paths:
      - "forward/sequence_semantics_registry_v1.json"
      - "scripts/ops/hes_sequence_protocol_drift_audit_v1.py"
      - "tests/ops/test_sequence_protocol_drift_watch_v1.py"
      - ".github/workflows/sequence-protocol-drift-watch-v1.yml"
  pull_request:
    paths:
      - "forward/sequence_semantics_registry_v1.json"
      - "scripts/ops/hes_sequence_protocol_drift_audit_v1.py"
      - "tests/ops/test_sequence_protocol_drift_watch_v1.py"
      - ".github/workflows/sequence-protocol-drift-watch-v1.yml"

permissions:
  contents: read

jobs:
  protocol-drift-audit:
    name: Official source drift audit (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Test drift audit safety
        run: python -m pytest -q tests/ops/test_sequence_protocol_drift_watch_v1.py

      - name: Run registry source audit
        id: audit
        continue-on-error: true
        run: |
          python scripts/ops/hes_sequence_protocol_drift_audit_v1.py \
            --registry forward/sequence_semantics_registry_v1.json \
            --output sequence_protocol_drift_audit_v1.json \
            --timeout 15 \
            --max-bytes 8000000 \
            --strict

      - name: Publish audit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("sequence_protocol_drift_audit_v1.json").read_text())
          lines = [
              "## HES Sequence Protocol Drift Watch",
              f"- Overall: **{report['overall_status']}**",
              f"- Registry SHA-256: `{report['registry_sha256']}`",
              f"- Records: {report['records_total']}; source documents: {report['sources_total']}",
              f"- Sources requiring review: {report['review_required_sources']}",
              "- Automatic capability promotion: **disabled**",
              "",
              "| Status | Records | Last-Modified | ETag | Source |",
              "|---|---|---|---|---|",
          ]
          for source in report["sources"]:
              lines.append(f"| {source['status']} | {', '.join(source['record_ids'])} | {source.get('last_modified') or 'n/a'} | {source.get('etag') or 'n/a'} | {source['url']} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: sequence-protocol-drift-report
          path: sequence_protocol_drift_audit_v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Raise scheduled review alert after preserving evidence
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && steps.audit.outcome == 'failure'
        run: |
          echo "::error::Sequence protocol sources are unpinned, changed, conflicting, or unreachable. Review the uploaded evidence before changing registry capabilities."
          exit 1
