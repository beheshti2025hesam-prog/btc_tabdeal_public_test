name: Native Candle Structure Bridge v1

on:
  push:
    branches:
      - feat/native-candle-structure-bridge-20261019
  pull_request:
    branches:
      - test/native-candle-adapter-contracts-20261019

permissions:
  contents: read

jobs:
  native-structure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Checkout pinned Wallex adapter
        uses: actions/checkout@v4
        with:
          ref: b490611636cca6d133ba9f9cc08d5d9d6333628b
          path: adapters/wallex
          fetch-depth: 1
      - name: Checkout pinned Binance adapter
        uses: actions/checkout@v4
        with:
          ref: 264ad62f51dee485c8ab9e1053631929c6379e4b
          path: adapters/binance
          fetch-depth: 1
      - name: Assert exact source revisions
        env:
          EXPECTED_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_WALLEX_SHA: b490611636cca6d133ba9f9cc08d5d9d6333628b
          EXPECTED_BINANCE_SHA: 264ad62f51dee485c8ab9e1053631929c6379e4b
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_TEST_SHA"
          test "$(git -C adapters/wallex rev-parse HEAD)" = "$EXPECTED_WALLEX_SHA"
          test "$(git -C adapters/binance rev-parse HEAD)" = "$EXPECTED_BINANCE_SHA"
          echo "TEST_SOURCE_SHA=$EXPECTED_TEST_SHA"
          echo "WALLEX_ADAPTER_SHA=$EXPECTED_WALLEX_SHA"
          echo "BINANCE_ADAPTER_SHA=$EXPECTED_BINANCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run native bridge and causal structure tests
        env:
          PYTHONPATH: .
          HES_WALLEX_ADAPTER_PATH: adapters/wallex/forward/native_wallex_ohlcv_v1.py
          HES_BINANCE_ADAPTER_PATH: adapters/binance/forward/native_binance_ohlcv_v1.py
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_native_candle_bridge_v1.py tests/test_native_adapter_bridge_contracts_v1.py tests/test_native_candle_structure_bridge_v1.py forward/test_candle_normalizer_v1.py forward/test_market_structure_v1.py forward/test_structure_observation_v1.py tests/test_clean_structure_observation_v1.py tests/test_clean_structure_context_v1.py tests/test_clean_structure_stability_v1.py tests/test_clean_regime_observation_v1.py tests/test_forward_observation_path_v1.py
